name: Validate source only (no EXE / no deployment)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application dependencies only
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Syntax checks
        run: python -m compileall -q .
      - name: Full synthetic source tests
        run: python -m unittest discover -s tests -v
      - name: Confirm no Windows packaging or deployment
        run: echo "Source-only verification completed; no EXE built or published."
